<html>
    <link rel="stylesheet" href="style.css">
    <body>
        
        <center>
            <h1 style="color:white;margin-bottom:20px;">
    🎓 Student Registration Form
</h1>
        <div id="container">
            
                <form>
            <table border="2">
                <tr>
                    <th>Name</th>
                    <td><input placeholder="Enter name" type="text" id="name"></td>
                </tr>
                <tr>
                    <th>Age</th>
                    <td><input placeholder="enter age" type="number" id="age"></td>
                </tr>
                <tr>
                    <th>Gender</th>
                    <td><select id="gender">
                        <option>Male</option>
                        <option>Fe Male</option>
                    </select>
                    </td>
                    
                </tr>
                <tr>
                    <th>Course</th>
                    <td><select id="course">
                        <option>JavaScript</option>
                        <option>Java</option>
                        <option>Python</option>
                        <option>c++</option>
                        <option>c</option>
                        <option>Go</option>
                    </select></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td><input type="email" placeholder="enter email here" id="email"></td>
                </tr>
               
            </table>
            </form>
            <button onclick="save()" type="button">Save Data</button>
            </div>
            
           <table id="task" border="1" align="center">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Course</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
           </table>
            
            </center>
        <script src="script.js"></script>
    </body>
</html>
